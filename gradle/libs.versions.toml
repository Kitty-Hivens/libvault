[versions]
# Pinned to the Nexira launcher's Kotlin so the cross-project Panama bindings
# stay binary-compatible. 2.4.1 can be substituted once it is on the plugin
# portal; the build does not depend on anything 2.4.1-only.
kotlin = "2.4.21"
slf4j  = "2.0.20"

# Java 22 is the desktop floor: that's where java.lang.foreign (Project Panama)
# was finalized as JEP 454. Earlier LTSes (17, 21) still have FFM in preview
# requiring --enable-preview, which a library shouldn't impose on consumers.
javaTarget = "22"

# libvault-core's floor, and libvault-android's. Core holds no Panama, and
# Android's runtime has no java.lang.foreign at all, so core is built for the
# bytecode level an Android build accepts. Raising it closes Android off.
javaCoreTarget = "17"

# Android Gradle Plugin, for libvault-android only. The same version the
# Nexira catalog carries. minSdk 26 is where java.nio.file and java.time arrive,
# and core's public API uses both.
agp               = "9.5.0"
androidCompileSdk = "36"
androidMinSdk     = "26"

# Core runs on Android but compiles against the JDK's class library, so a java.*
# call Android lacks below minSdk compiles fine and fails on a phone. Animal
# Sniffer checks core's bytecode against the Android API signature of the same
# level as androidMinSdk above. Move the two together.
animalSniffer       = "2.0.1"
androidApiSignature = "0.16.0"

# Argon2id for the Passphrase key-derivation tier. BouncyCastle's provider is
# PURE JAVA -- no bundled native .so/.dll/.dylib (unlike argon2-jvm), so the
# jar stays free of native binaries and there is no second FFI binding beyond
# Panama. Used only by the software-file fallback; the OS-keyring tiers never
# touch it. VERIFY the latest at search.maven.org/artifact/org.bouncycastle/
# bcprov-jdk18on and bump -- this is a starting point, not necessarily newest.
bouncycastle = "1.86"

# Test stack -- light. JUnit 5 + Kotest assertions for readable test code.
junit  = "5.11.4"
kotest = "5.9.1"

# Instrumented tests for libvault-android, which run on a device because the
# Android Keystore exists nowhere else.
androidxTestRunner = "1.7.0"
androidxTestJunit  = "1.3.0"

# Maven Central publishing (signing + Central Portal upload). Pinned here;
# VERIFY the latest at plugins.gradle.org/plugin/com.vanniktech.maven.publish
# and bump -- this is a starting point, not necessarily the newest.
mavenPublish = "0.37.0"

[libraries]
slf4j-api    = { group = "org.slf4j", name = "slf4j-api",    version.ref = "slf4j" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

junit-jupiter           = { group = "org.junit.jupiter", name = "junit-jupiter",           version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotest-assertions       = { group = "io.kotest", name = "kotest-assertions-core",          version.ref = "kotest" }

androidx-test-runner = { group = "androidx.test",     name = "runner", version.ref = "androidxTestRunner" }
androidx-test-junit  = { group = "androidx.test.ext", name = "junit",  version.ref = "androidxTestJunit" }

android-api-signature = { group = "com.toasttab.android", name = "gummy-bears-api-26", version.ref = "androidApiSignature" }

[plugins]
kotlin-jvm      = { id = "org.jetbrains.kotlin.jvm",     version.ref = "kotlin" }
android-library = { id = "com.android.library",          version.ref = "agp" }
mavenPublish    = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
animalSniffer   = { id = "ru.vyarus.animalsniffer",      version.ref = "animalSniffer" }
